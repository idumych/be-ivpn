name: build

# Runs the core tests on Linux and builds the Haiku .hpkg on Haiku R1/beta6.
# Run by hand, or on a v* tag push, which also attaches the package and
# SHA256SUMS to that tag's release (created as a prerelease if it doesn't
# exist yet).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: sh tests/run_tests.sh

  hpkg:
    # Haiku R1/beta6 x86_64 in a VM on the runner. Haiku has no arm64
    # release or package repository yet, so there is no arm64 .hpkg.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: haiku
          version: r1beta6
          architecture: x86-64
          memory: 4G
          cpu_count: 4
          shell: bash
          run: |
            pkgman install -y gcc haiku_devel curl_devel openssl3_devel golang git
            sh packaging/haiku/build-hpkg.sh
            package list -i be_ivpn-*.hpkg
      - uses: actions/upload-artifact@v4
        with:
          name: hpkg-x86_64
          path: be_ivpn-*.hpkg

  release:
    needs: [tests, hpkg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum be_ivpn-*.hpkg > SHA256SUMS
          cat SHA256SUMS
          # New releases start as prereleases; mark them final after testing.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --title "$GITHUB_REF_NAME" \
              --notes "See the README for install steps."
          gh release upload "$GITHUB_REF_NAME" be_ivpn-*.hpkg SHA256SUMS \
            --clobber -R "$GITHUB_REPOSITORY"
